<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Tailor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Palette: espresso #261311, copper #c4895a, parchment #f1e6d6, forest #1f3b34 */
  :root { --bg:#261311; --paper:#321b17; --card:#321b17; --ink:#f1e6d6; --mute:#b5a392; --line:#503630; --acc:#c4895a; --onacc:#261311; --blush:#c4895a; --sage:#2f5a4e; --mist:#3d2420;
          --hover:#d9a074; --okbd:#5f9a85; --warnbd:#c4895a; --ok:#94c7ad; --warn:#e3a574; --bad:#ff9f90; --add:#213a33; --del:#4a2824; --shadow:0 12px 28px -16px rgba(0,0,0,.8);
          --ui:"Lora",Georgia,"Times New Roman",serif; --text:var(--ui); --display:"Syncopate","Helvetica Neue",Arial,sans-serif; color-scheme:dark; }
  @media (prefers-color-scheme: light) { :root:not([data-theme=dark]) { --bg:#f3eadc; --paper:#fbf5ea; --card:#fbf5ea; --ink:#261311; --mute:#7a6657; --line:#d9c8b0; --acc:#6e4026; --onacc:#f7eee0; --blush:#6e4026; --sage:#2f5a4e; --mist:#eadbc6; --hover:#4f2b17; --okbd:#2f5a4e; --warnbd:#b87a4b; --ok:#2f5a4e; --warn:#9a5532; --bad:#9e3a32; --add:#dbe8e1; --del:#f1d9d2; --shadow:0 10px 24px -18px rgba(38,19,17,.5); color-scheme:light; } }
  :root[data-theme=light] { --bg:#f3eadc; --paper:#fbf5ea; --card:#fbf5ea; --ink:#261311; --mute:#7a6657; --line:#d9c8b0; --acc:#6e4026; --onacc:#f7eee0; --blush:#6e4026; --sage:#2f5a4e; --mist:#eadbc6; --hover:#4f2b17; --okbd:#2f5a4e; --warnbd:#b87a4b; --ok:#2f5a4e; --warn:#9a5532; --bad:#9e3a32; --add:#dbe8e1; --del:#f1d9d2; --shadow:0 10px 24px -18px rgba(38,19,17,.5); color-scheme:light; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 var(--text); }
  .swatch { display:flex; height:10px; } .swatch i { flex:1; } .swatch i:nth-child(1){background:#c4895a} .swatch i:nth-child(2){background:#f1e6d6} .swatch i:nth-child(3){background:#7a4a2e} .swatch i:nth-child(4){background:#2f5a4e} .swatch i:nth-child(5){flex:2.2;background:#3d2420}
  header { padding:26px 32px 14px; text-align:center; max-width:1280px; margin:0 auto; }
  h1 { font:700 clamp(22px,3.4vw,32px)/1.1 var(--display); letter-spacing:.22em; margin:0; color:var(--ink); padding-left:.22em; }  .sub { color:var(--mute); font:13px var(--ui); } #status { display:block; margin-top:10px; font-size:12px; }
  main { display:grid; grid-template-columns:minmax(340px,490px) 1fr; gap:24px; padding:14px 32px 56px; align-items:start; max-width:1280px; margin:0 auto; }
  @media (max-width:980px) { main { grid-template-columns:1fr; padding:12px 16px 40px; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:3px; padding:18px 20px; margin-bottom:18px; box-shadow:var(--shadow); position:relative; }
  .card::before { content:""; position:absolute; inset:5px; border:1px solid color-mix(in srgb, var(--line) 55%, transparent); border-radius:2px; pointer-events:none; }
  h2 { font:400 12px/1.2 var(--display); letter-spacing:.18em; text-transform:uppercase; color:var(--acc); margin:0 0 12px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  h2 .sub { font-family:var(--ui); text-transform:none; letter-spacing:0; font-size:12px; }
  label { font:500 13px var(--ui); color:var(--mute); display:block; margin:10px 0 5px; }
  input[type=text], textarea, select { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:2px; background:var(--bg); color:var(--ink); font:14px var(--text); }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--blush); outline-offset:1px; border-color:var(--sage); }
  input[type=checkbox] { accent-color:var(--acc); }
  textarea { min-height:190px; resize:vertical; font-size:13px; }
  .row { display:flex; gap:8px; } .row > * { flex:1; } .row > button { flex:0 0 auto; }
  button { padding:8px 16px; border-radius:2px; border:1px solid var(--acc); background:transparent; color:var(--acc); font:600 13px var(--ui); cursor:pointer; transition:background .15s, color .15s; }
  button:hover:not(:disabled) { background:var(--mist); } 
  button.primary { background:var(--acc); border-color:var(--acc); color:var(--onacc); width:100%; margin-top:12px; padding:11px; font-size:14px; }
  button.primary:hover:not(:disabled) { background:var(--hover); border-color:var(--hover); color:var(--onacc); }
  button:disabled { opacity:.5; cursor:wait; }
  .msg { font:13px var(--ui); margin-top:6px; } .err { color:var(--bad); } .okc { color:var(--ok); } .warnc { color:var(--warn); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; } .chip { background:var(--bg); border:1px solid var(--line); border-radius:99px; padding:2px 11px; font:12px var(--ui); }
  .stat { display:flex; gap:18px; flex-wrap:wrap; font:13px var(--ui); } .stat b { font-weight:700; }
  iframe { width:100%; height:80vh; border:1px solid var(--line); border-radius:2px; background:#fff; }
  .slot { border-top:1px dashed var(--line); padding:12px 0; } .slot:first-of-type { border-top:0; }
  
  .slot-h { display:flex; justify-content:space-between; gap:8px; align-items:center; font:600 14px var(--ui); }
  .slot-h label { margin:0; font:400 12px var(--ui); display:flex; gap:6px; align-items:center; }
  .b { font-size:13px; padding:5px 10px; border-radius:2px; margin:4px 0; white-space:pre-wrap; border-left:3px solid transparent; }
  .b.old { background:var(--del); border-left-color:var(--blush); text-decoration:line-through; text-decoration-color:color-mix(in srgb, var(--ink) 40%, transparent); opacity:.85; } .b.new { background:var(--add); border-left-color:var(--okbd); } .b.same { color:var(--mute); }
  details { font:12px var(--ui); color:var(--mute); margin:2px 0 4px 8px; } details q { display:block; margin:2px 0; } .nf { color:var(--bad); }
  .tabs { display:flex; gap:6px; margin-bottom:8px; } .tabs button.on { background:var(--acc); color:var(--onacc); border-color:var(--acc); }
  .chip.k-ok { border-color:var(--okbd); background:var(--add); color:var(--ok); } .chip.k-warn { border-color:var(--warnbd); background:var(--del); color:var(--warn); }
  .hide { display:none; } ul { margin:4px 0 0 18px; padding:0; } .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  a { color:var(--acc); }
  a.btn { text-decoration:none; padding:9px 18px; border-radius:2px; border:1px solid var(--acc); background:var(--acc); color:var(--onacc); font:600 13px var(--ui); } a.btn.alt { background:transparent; color:var(--acc); }
  a.btn:hover { background:var(--hover); border-color:var(--hover); color:var(--onacc); }
  .sub[style*="margin-top"] { font-size:12px; font-weight:600; }
</style>
</head>
<body>
<div class="swatch"><i></i><i></i><i></i><i></i><i></i></div>
<header style="position:relative"><button id="theme" type="button" style="position:absolute;right:32px;top:22px;padding:6px 12px;font-size:12px" aria-label="Toggle light or dark mode">Light</button><h1>RESUME TAILOR</h1><span class="sub" id="status"></span></header>
<main>
  <section>
    <div class="card">
      <h2>1. Job</h2>
      <label for="url">Job link (optional: Greenhouse, Lever, Ashby, most career pages)</label>
      <div class="row"><input type="text" id="url" placeholder="https://boards.greenhouse.io/..."><button id="fetch">Fetch</button></div>
      <div class="msg" id="fetchmsg"></div>
      <label for="jd">Job description. Paste the full text here if the link misses anything.</label>
      <textarea id="jd" placeholder="Paste the job description..."></textarea>
    </div>
    <div class="card">
      <h2>2. Base resume</h2>
      <select id="base"><option value="auto">Auto-pick best fit</option></select>
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="mock"> Dry run without the AI (only reorders skills, free)</label>
      <button class="primary" id="go">Tailor my resume</button>
      <div class="msg" id="genmsg"></div>
    </div>
    <div class="card hide" id="report">
      <h2>What changed</h2>
      <div id="summary" style="font-size:14px"></div>
      <div class="stat" id="stats" style="margin-top:8px"></div>
      <div id="kw" class="chips" style="margin-top:8px"></div>
      <div id="warns" style="margin-top:8px"></div>
      <div id="gaps" style="margin-top:8px"></div>
    </div>
    <div class="card hide" id="atsCard">
      <h2>ATS check</h2>
      <div id="atsBody"></div>
    </div>
    <div class="card hide" id="trackCard">
      <h2>3. Log this application</h2>
      <div class="row"><div><label for="tco">Company</label><input type="text" id="tco"></div><div><label for="trole">Role</label><input type="text" id="trole"></div></div>
            <button class="primary" id="track">Add to tracker</button>
      <div class="msg" id="trackmsg"></div>
      <div class="sub" id="tracksub" style="margin-top:4px"></div>
    </div>
    <div class="card hide" id="slotsCard">
      <h2>Review edits <span class="sub">(untick to keep your original for that part)</span></h2>
      <div id="slots"></div>
    </div>
  </section>
  <section>
    <div class="card" style="padding:10px">
      <div class="actions" style="margin:0 0 8px"><a class="btn hide" id="dl" href="#">Download PDF</a><a class="btn alt hide" id="dltex" href="#">Download .tex</a></div>
      <iframe id="pdf" title="Resume preview"></iframe>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let job = null, jdMeta = {title:'', company:'', url:''}, sheetUrl = '';
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}

api('/api/status').then(s => {
  const bits = [];
  if (!s.latex) bits.push('LaTeX not found');
  bits.push(!s.api_key ? 'Dry run only' : s.provider === 'claude-code' ? 'Claude (Subscription)' : 'Claude (API)');
  $('status').textContent = bits.join(' · ');
  if (!s.api_key) $('mock').checked = true;
  sheetUrl = s.sheet_url;
  $('base').innerHTML = '<option value="auto">Auto-pick best fit</option>' + Object.entries(s.bases).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
    $('tracksub').innerHTML = s.tracker === 'google' ? `Logging to your <a href="${s.sheet_url}" target="_blank">Google Sheet</a> and Drive folder.` : 'Google not connected yet: saving to the local applications/ folder (see README to connect your Sheet).';
}).catch(() => {});

$('jd').addEventListener('input', () => { $('fetchmsg').textContent = ''; $('genmsg').textContent = ''; });
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') $('fetch').click(); });

$('fetch').onclick = async () => {
  const m = $('fetchmsg'); m.className = 'msg';
  if (!$('url').value.trim()) { m.textContent = 'No link? No problem. Just paste the job text in the box below.'; return; }
  m.textContent = 'Fetching...'; $('fetch').disabled = true;
  try {
    const r = await api('/api/fetch-jd', {url: $('url').value});
    jdMeta = {title: r.title, company: r.company, url: r.url};
    $('jd').value = (r.title ? r.title + (r.company ? ' at ' + r.company : '') + '\n\n' : '') + r.text;
    m.className = 'msg okc'; m.textContent = `Got ${r.text.length.toLocaleString()} characters via ${r.source}. Check it looks right.`;
  } catch (e) { m.className = 'msg err'; m.textContent = e.message + ' You can paste the job text in the box below instead.'; }
  $('fetch').disabled = false;
};

$('go').onclick = async () => {
  const m = $('genmsg'); $('fetchmsg').textContent = '';
  if ($('jd').value.trim().length < 80) { m.className = 'msg err'; m.textContent = 'Paste the job description above first (at least a few sentences).'; return; }
   m.className = 'msg'; m.textContent = 'Tailoring and compiling (can take up to a minute)...'; $('go').disabled = true;
  try { job = await api('/api/generate', {base:$('base').value, jd:$('jd').value, mock:$('mock').checked}); m.textContent = ''; render(); }
  catch (e) { m.className = 'msg err'; m.textContent = e.message; }
  $('go').disabled = false;
};

function render() {
  $('trackCard').classList.remove('hide');
  if (!$('tco').value) $('tco').value = jdMeta.company || '';
  if (!$('trole').value) $('trole').value = jdMeta.title || '';
  $('report').classList.remove('hide'); $('slotsCard').classList.remove('hide');
  $('summary').innerHTML = `<b>${esc(job.base_name)} base</b>${job.base_reason ? ' <span class="sub">(' + esc(job.base_reason) + ')</span>' : ''}<br>${esc(job.summary || '')}`;
  const fill = job.fill_pct;
  $('stats').innerHTML = job.ok
    ? `<span>Pages: <b class="${job.pages === 1 ? 'okc' : 'err'}">${job.pages}</b></span><span>Page fill: <b class="${fill >= 96 ? 'okc' : 'warnc'}">${fill}%</b></span><span>Changed parts: <b>${job.slots.filter(s => s.changed && !s.reverted).length}</b></span>`
    : `<span class="err">Compile failed: ${esc(job.error || '')}</span>`;
  $('kw').innerHTML = (job.keywords || []).map(k => `<span class="chip">${esc(k)}</span>`).join('');
  $('warns').innerHTML = job.warnings.length ? '<b class="warnc">Notes</b><ul>' + job.warnings.map(w => `<li>${esc(w)}</li>`).join('') + '</ul>' : '';
  $('gaps').innerHTML = (job.gaps || []).length ? '<b>Job asks for, but your Master Doc has no evidence (not added)</b><ul>' + job.gaps.map(g => `<li>${esc(g)}</li>`).join('') + '</ul>' : '';
  const groups = {};
  job.slots.forEach(s => (groups[s.group] = groups[s.group] || []).push(s));
  let h = '';
  for (const [g, list] of Object.entries(groups)) {
    h += `<div class="sub" style="margin-top:8px">${esc(g)}</div>`;
    for (const s of list) {
      h += `<div class="slot"><div class="slot-h"><span>${esc(s.label)}${s.changed ? '' : ' <span class="sub">(unchanged)</span>'}</span>`
        + (s.changed ? `<label><input type="checkbox" data-id="${esc(s.id)}" ${s.reverted ? '' : 'checked'}> use edit</label>` : '') + '</div>';
      if (s.changed) {
        s.after.forEach((a, i) => {
          const b = s.before[i];
          if (a === b) h += `<div class="b same">${md(a)}</div>`;
          else {
            if (b !== undefined) h += `<div class="b old">${md(b)}</div>`;
            h += `<div class="b new">${md(a)}</div>`;
            const n = (s.notes || [])[i];
            if (n && n.sources && n.sources.length) h += '<details><summary>Master Doc evidence</summary>' + n.sources.map(q => `<q class="${q.found ? '' : 'nf'}">${q.found ? '✓' : '✗'} ${esc(q.quote)}</q>`).join('') + '</details>';
          }
        });
      }
      h += '</div>';
    }
  }
  $('slots').innerHTML = h;
  document.querySelectorAll('#slots input[type=checkbox]').forEach(cb => cb.onchange = onToggle);
  renderAts();
  showPdf();
}


function renderAts() {
  const a = job.ats, el = $('atsBody');
  $('atsCard').classList.toggle('hide', !a);
  if (!a) return;
  const chip = (t, cls) => `<span class="chip ${cls}">${esc(t)}</span>`;
  const bar = (v, c) => `<div style="height:8px;background:var(--line);border-radius:4px;overflow:hidden"><div style="width:${v}%;height:100%;background:var(--${c})"></div></div>`;
  let h = `<div class="stat"><span>Job keyword match: <b>${a.before_pct}%</b> before &rarr; <b class="${a.after_pct >= 70 ? 'okc' : 'warnc'}">${a.after_pct}%</b> now</span><span class="sub">${a.matched.length} of ${a.total} keywords</span></div>`
    + `<div style="margin:6px 0">${bar(a.after_pct, a.after_pct >= 70 ? 'ok' : 'warn')}</div>`;
  if (a.matched.length) h += `<div class="sub" style="margin-top:6px">On your resume</div><div class="chips">${a.matched.map(t => chip(t, 'k-ok')).join('')}</div>`;
  if (a.missing_supported.length) h += `<div class="sub" style="margin-top:8px">In your Master Doc but not on this resume (consider adding)</div><div class="chips">${a.missing_supported.map(t => chip(t, 'k-warn')).join('')}</div>`;
  if (a.gaps.length) h += `<div class="sub" style="margin-top:8px">Not in your Master Doc (don't add unless it is true)</div><div class="chips">${a.gaps.map(t => chip(t, '')).join('')}</div>`;
  if (a.skills_not_in_bullets.length) h += `<div class="sub" style="margin-top:8px">Listed skills no bullet shows (recruiters look for proof)</div><div class="chips">${a.skills_not_in_bullets.slice(0, 8).map(t => chip(t, '')).join('')}${a.skills_not_in_bullets.length > 8 ? '<span class="sub">+' + (a.skills_not_in_bullets.length - 8) + ' more</span>' : ''}</div>`;
  h += '<div class="sub" style="margin-top:10px">Parse check (what an ATS reads from the PDF)</div><ul style="list-style:none;margin:4px 0 0;padding:0;font-size:13px">'
    + a.parse.map(c => `<li class="${c.ok ? 'okc' : 'err'}">${c.ok ? '✓' : '✗'} ${esc(c.name)}${c.detail && !c.ok ? ' (' + esc(c.detail) + ')' : ''}</li>`).join('') + '</ul>';
  el.innerHTML = h;
}

function showPdf() {
  const ok = job.ok;
  $('pdf').src = ok ? `/api/pdf/${job.job_id}?v=${job.v}` : 'about:blank';
  for (const [id, url] of [['dl', `/api/pdf/${job.job_id}?download=true`], ['dltex', `/api/tex/${job.job_id}`]]) { $(id).classList.toggle('hide', !ok); $(id).href = url; }
}

$('track').onclick = async () => {
  const m = $('trackmsg'); m.className = 'msg'; m.textContent = 'Saving...'; $('track').disabled = true;
  try {
    const r = await api('/api/track', {job_id: job.job_id, company: $('tco').value, role: $('trole').value});
    m.className = 'msg okc';
    m.innerHTML = r.mode === 'google' ? `Added ${esc(r.company)}: ${esc(r.role)}. <a href="${r.drive_url}" target="_blank">Resume PDF</a> · <a href="${r.sheet_url}" target="_blank">Open sheet</a>` : `Saved locally: ${esc(r.job)}`;
  } catch (e) { m.className = 'msg err'; m.textContent = e.message; }
  $('track').disabled = false;
};

async function onToggle() {
  const reverted = [...document.querySelectorAll('#slots input[type=checkbox]')].filter(c => !c.checked).map(c => c.dataset.id);
  document.querySelectorAll('#slots input').forEach(c => c.disabled = true);
  try { job = await api('/api/revert', {job_id: job.job_id, reverted}); render(); }
  catch (e) { $('genmsg').className = 'msg err'; $('genmsg').textContent = e.message; }
}

(function () {
  const root = document.documentElement, btn = document.getElementById('theme');
  const isLight = () => root.dataset.theme ? root.dataset.theme === 'light' : matchMedia('(prefers-color-scheme: light)').matches;
  const paint = () => { btn.textContent = isLight() ? 'Dark' : 'Light'; };
  try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch (e) {}
  btn.onclick = () => { const t = isLight() ? 'dark' : 'light'; root.dataset.theme = t; try { localStorage.setItem('theme', t); } catch (e) {} paint(); };
  paint();
})();
</script>
</body>
</html>
